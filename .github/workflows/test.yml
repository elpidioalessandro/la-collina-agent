# A ogni push e pull request: test dell'agente dati (pytest), del back end (node:test) e build del front end.
# Nessun test chiama Groq: i modelli sono sostituiti da versioni finte, quindi non serve nessuna chiave.
name: Test

on:
  push:
  pull_request:

jobs:
  agente-dati:
    name: Agente dati (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_agent/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  back-end:
    name: Back end (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  front-end:
    name: Front end (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
